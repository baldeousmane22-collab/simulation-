# ===================================================================
# Construction de l'APK Android signé (release) avec Capacitor
# - minSdk 24 (Android 7.0) ; targetSdk / compileSdk 36 (Android 16)
# - L'APK est publié dans « Releases » du dépôt :
#   https://github.com/<compte>/<dépôt>/releases/latest
#
# Signature (toujours la même clé, pour installer les mises à jour par-dessus) :
#  1) si les secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#     ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD existent, ils sont utilisés ;
#  2) sinon, une clé permanente créée automatiquement par GitHub et gardée
#     dans le cache privé des constructions (rien à configurer) ;
#  3) en dernier recours seulement, une clé temporaire.
# ===================================================================
name: Construire l'APK Android

on:
  push:
    branches: [main, 'claude/**']
    paths: ['www/**', '!www/plan-maison/**', 'accouplements/**', '!accouplements/apk/**', 'engrenages/**', '!engrenages/apk/**', 'android/**', 'scripts/**', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:
  # Chaque lundi : entretien de la clé permanente (voir job « entretien »)
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Réutilise la clé chaque semaine : GitHub efface un cache inutilisé 7 jours.
  entretien:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Relire la clé permanente (la garde en vie)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cle-signature-apk
          key: cle-signature-apk-v1
          lookup-only: false

  apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (avec l'historique pour le numéro de version)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Appliquer le numéro de version (site, cache, application)
        run: bash scripts/version.sh

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Compléter le SDK Android (préinstallé sur le runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Installer les dépendances (Capacitor)
        run: npm ci

      - name: Ajouter l'appli Accouplements (cours + 3D) dans l'APK
        run: |
          test -f accouplements/index.html
          rm -rf www/accouplements
          cp -r accouplements www/accouplements
          rm -rf www/accouplements/apk   # projet Android de l'appli seule : inutile ici

      - name: Ajouter l'appli Engrenages (3D + calculs) dans l'APK
        run: |
          test -f engrenages/index.html
          rm -rf www/engrenages
          cp -r engrenages www/engrenages
          rm -rf www/engrenages/apk   # projet Android de l'appli seule : inutile ici

      - name: Copier l'application web dans le projet Android
        run: |
          npx cap sync android
          test -f android/app/src/main/assets/public/accouplements/index.html
          test -f android/app/src/main/assets/public/accouplements/cours/cours.js
          test -f android/app/src/main/assets/public/engrenages/js/scene3d.js

      # Clé permanente sans aucune configuration : elle est créée une seule fois
      # par GitHub puis conservée dans le cache privé des constructions (jamais
      # publiée dans le dépôt). Le job « entretien » ci-dessous la réutilise
      # chaque semaine pour que GitHub ne l'efface pas.
      - name: Récupérer la clé permanente (cache privé GitHub)
        id: cle
        uses: actions/cache/restore@v4
        with:
          path: ~/.cle-signature-apk
          key: cle-signature-apk-v1

      - name: Créer la clé permanente (première fois seulement)
        if: steps.cle.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.cle-signature-apk
          PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore ~/.cle-signature-apk/signature.jks -storetype PKCS12 \
            -alias hydraulique -keyalg EC -groupname secp256r1 -validity 10950 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Simulateur hydraulique 3D, OU=Formation, O=Formation mecanique, C=FR"
          printf '%s' "$PASS" > ~/.cle-signature-apk/mot-de-passe
          echo "::notice::Clé de signature permanente créée et conservée par GitHub."

      - name: Conserver la clé permanente (première fois seulement)
        if: steps.cle.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cle-signature-apk
          key: cle-signature-apk-v1

      - name: Préparer la clé de signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/signature.jks"
          if [ -n "$KS_B64" ]; then
            echo "Utilisation de la clé permanente enregistrée dans les secrets du dépôt."
            # Espaces ou retours à la ligne ajoutés par un copier-coller : on les retire
            printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$KS"
            KS_PASS="$(printf '%s' "$KS_PASS" | tr -d '\r\n')"
            KS_ALIAS="$(printf '%s' "$KS_ALIAS" | tr -d ' \r\n')"
            KS_KEY_PASS="$(printf '%s' "${KS_KEY_PASS:-$KS_PASS}" | tr -d '\r\n')"
            # Vérification : la clé s'ouvre avec le mot de passe et l'alias fournis
            keytool -list -keystore "$KS" -storepass "$KS_PASS" -alias "$KS_ALIAS" | grep -i "SHA-256" \
              || { echo "::error::Clé de signature illisible : vérifiez les 4 secrets ANDROID_*."; exit 1; }
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_KEY_PASS" >> "$GITHUB_ENV"
          elif [ -f ~/.cle-signature-apk/signature.jks ]; then
            echo "Utilisation de la clé permanente conservée par GitHub."
            cp ~/.cle-signature-apk/signature.jks "$KS"
            PASS="$(cat ~/.cle-signature-apk/mot-de-passe)"
            echo "::add-mask::$PASS"
            keytool -list -keystore "$KS" -storepass "$PASS" -alias hydraulique | grep -i "SHA-256"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=hydraulique" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::Aucune clé permanente disponible : création d'une clé temporaire."
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -v -keystore "$KS" -alias hydraulique \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Simulateur hydraulique 3D, OU=Formation, O=Formation mecanique, C=FR"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=hydraulique" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Construire l'APK release signé
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Vérifier la signature et renommer l'APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { ls -R android/app/build/outputs; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion"
          mkdir -p sortie
          cp "$APK" sortie/Hydraulique3D.apk

      - name: Conserver l'APK (artefact de la construction)
        uses: actions/upload-artifact@v4
        with:
          name: Hydraulique3D-apk
          path: sortie/Hydraulique3D.apk

      # Seules les versions de la branche principale sont publiées (lien « latest »)
      - name: Publier l'APK dans les « Releases »
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Simulateur hydraulique 3D — version ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: sortie/Hydraulique3D.apk
          body: |
            APK Android signé du simulateur hydraulique 3D (Android 7.0 minimum).

            **Installation** : téléchargez `Hydraulique3D.apk` sur le téléphone, ouvrez-le,
            puis autorisez l'installation depuis cette source si Android le demande.
