# ===================================================================
# Publication de l'application web (PWA) sur GitHub Pages
# Adresse : https://<compte>.github.io/<dépôt>/
#
# Les applis autonomes (un dossier chacune à la racine du dépôt) sont copiées
# dans le site publié : https://<compte>.github.io/<dépôt>/<dossier>/
#
# Fonctionne avec les deux réglages possibles de Settings > Pages > Source :
#  - « Deploy from a branch » (gh-pages) : job « branche-gh-pages »
#  - « GitHub Actions »                  : job « deploiement-actions »
# ===================================================================
name: Publier sur GitHub Pages

on:
  push:
    branches: [main, 'claude/**', 'ccr-*']
    paths: ['www/**', 'pompe-centrifuge/**', 'circuit-pneumatique/**', 'accouplements/**', 'engrenages/**', 'broyage/**', 'scripts/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  branche-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (avec l'historique pour le numéro de version)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Appliquer le numéro de version (site, cache, application)
        run: bash scripts/version.sh

      - name: Vérifier la présence des fichiers essentiels
        run: |
          for f in index.html manifest.webmanifest sw.js js/app.js js/scene3d.js vendor/three.min.js plan-maison/index.html; do
            test -f "www/$f" || { echo "Fichier manquant : www/$f"; exit 1; }
          done

      - name: Ajouter les applis autonomes au site
        run: |
          for d in pompe-centrifuge circuit-pneumatique accouplements engrenages broyage; do
            test -f "$d/index.html" || { echo "Fichier manquant : $d/index.html"; exit 1; }
            cp -r "$d" www/
            rm -rf "www/$d/apk"   # projet Android : inutile sur le site
          done
          # nouveau numéro de cache hors connexion à chaque publication (mise à jour des téléphones)
          sed -i "s/^const VERSION_CACHE = .*/const VERSION_CACHE = 'engrenages-v$(git rev-list --count HEAD)';/" www/engrenages/sw.js
          sed -i "s/^const VERSION_CACHE = .*/const VERSION_CACHE = 'broyage-v$(git rev-list --count HEAD)';/" www/broyage/sw.js

      - name: Publier dans la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publication de l'application web"

  # Déploiement direct (réglage « GitHub Actions ») : uniquement depuis main.
  # Si le dépôt est réglé sur « Deploy from a branch », ce job est ignoré sans erreur.
  deploiement-actions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le code (avec l'historique pour le numéro de version)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Appliquer le numéro de version (site, cache, application)
        run: bash scripts/version.sh

      - name: Ajouter les applis autonomes au site
        run: |
          for d in pompe-centrifuge circuit-pneumatique accouplements engrenages broyage; do
            test -f "$d/index.html" || { echo "Fichier manquant : $d/index.html"; exit 1; }
            cp -r "$d" www/
            rm -rf "www/$d/apk"   # projet Android : inutile sur le site
          done
          # nouveau numéro de cache hors connexion à chaque publication (mise à jour des téléphones)
          sed -i "s/^const VERSION_CACHE = .*/const VERSION_CACHE = 'engrenages-v$(git rev-list --count HEAD)';/" www/engrenages/sw.js
          sed -i "s/^const VERSION_CACHE = .*/const VERSION_CACHE = 'broyage-v$(git rev-list --count HEAD)';/" www/broyage/sw.js

      - name: Préparer le site
        run: touch www/.nojekyll

      - name: Envoyer les fichiers du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./www

      - name: Déployer sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
