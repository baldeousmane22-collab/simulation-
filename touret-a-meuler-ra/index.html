<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Touret à meuler – Réalité augmentée</title>
<style>
  :root { --navy: #0f2741; --amber: #f2a900; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Segoe UI", Roboto, Arial, sans-serif; background: #0b1626; color: #fff; }
  #v3d { position: fixed; inset: 0; }
  #overlay { position: fixed; inset: 0; pointer-events: none; }
  #overlay .ui { pointer-events: auto; }
  .top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: linear-gradient(rgba(15,39,65,.92), rgba(15,39,65,0)); }
  .top h1 { font-size: 16px; margin: 0; flex: 1; line-height: 1.2; }
  .top h1 small { display: block; font-weight: 400; font-size: 11px; color: #c9d6e6; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 9px 13px; font-weight: 700; font-size: 14px; background: #fff; color: var(--navy); cursor: pointer; }
  button.on { background: var(--amber); }
  #ar { background: var(--amber); white-space: nowrap; }
  #ar.pulse { animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(242,169,0,.7); } 50% { box-shadow: 0 0 0 10px rgba(242,169,0,0); } }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(15,39,65,0), rgba(15,39,65,.95) 30%); display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; align-items: center; }
  .bar label { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .bar input[type=range] { width: 110px; accent-color: var(--amber); }
  #scalebox { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,.15); border-radius: 999px; padding: 2px; }
  #scalebox button { padding: 7px 12px; }
  #scaleval { min-width: 34px; text-align: center; font-weight: 700; font-size: 13px; }
  #cap { position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%); background: rgba(15,39,65,.92); padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 15px; width: max-content; max-width: 92%; text-align: center; display: none; border: 2px solid var(--amber); }
  #cap.show { display: block; }
  #hint { position: absolute; top: 112px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.65); padding: 8px 14px; border-radius: 12px; font-size: 14px; width: max-content; max-width: 90%; text-align: center; display: none; }
  #hint.show { display: block; }
  #arnote { position: absolute; top: 112px; left: 12px; right: 12px; background: #fff3cd; color: #5c4300; border-radius: 12px; padding: 10px 12px; font-size: 13px; display: none; }
  #arnote.show { display: block; }
  #nompanel { position: absolute; left: 8px; top: 64px; bottom: 140px; width: min(300px, 80vw); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  #nomen { display: none; overflow-y: auto; background: rgba(15,39,65,.93); border-radius: 14px; padding: 8px; width: 100%; }
  #nompanel.open #nomen { display: block; }
  .chip { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; color: #fff; font-weight: 500; font-size: 13px; padding: 5px 6px; border-radius: 8px; text-align: left; }
  .chip:active { background: rgba(255,255,255,.12); }
  .sw { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 24px; border-radius: 6px; font-weight: 800; font-size: 13px; border: 2px solid #fff; }
  .foot { font-size: 11px; color: #c9d6e6; padding: 6px 4px 2px; }
  body.ar .top { background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,0)); }
</style>
</head>
<body>
<div id="v3d"></div>
<div id="overlay">
  <div class="top ui">
    <h1>Touret à meuler 3D<small>Simulation animée + réalité augmentée · B. Ousmane · ERAM Boké</small></h1>
    <button id="ar">👓 Réalité augmentée</button>
  </div>
  <div id="hint"></div>
  <div id="arnote" class="ui"></div>
  <div id="nompanel" class="ui">
    <button id="nomtoggle">📋 Nomenclature</button>
    <div id="nomen"><div class="foot" style="order:-1">Touchez une pièce : elle clignote.<br>Sans repère : rondelles frein + écrou à encoches côté meule.</div></div>
  </div>
  <div id="cap"></div>
  <div class="bar ui">
    <button id="seq">🔧 Montage pas à pas</button>
    <button id="spk">✨ En marche</button>
    <button id="cut">✂ Coupe</button>
    <button id="lab"># Repères</button>
    <button id="play">⏸</button>
    <label>Éclaté <input id="exp" type="range" min="0" max="100" value="0"></label>
    <span id="scalebox"><button id="sminus">−</button><span id="scaleval">×1</span><button id="splus">+</button></span>
    <button id="move">📍 Déplacer</button>
    <button id="reset">⟲</button>
  </div>
</div>
