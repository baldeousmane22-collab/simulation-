<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fraisage 3D</title>
  <meta name="description" content="Simulation animée du fraisage en 3D : surfaçage, épaulement, rainures, poche, contournage, rainure en T, queue d'aronde… avec cours, astuces, calcul des conditions de coupe et quiz.">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fraisage 3D">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="entete">
  <div class="titre"><span class="logo">🛠️</span> Fraisage 3D <small>Opérations de fraisage</small></div>
  <nav class="types" id="types" aria-label="Opérations de fraisage"></nav>
</header>

<main class="disposition">
  <section class="zone3d" id="zone3d" aria-label="Vue 3D">
    <canvas id="canvas3d" aria-label="Fraiseuse animée en 3D"></canvas>
    <div id="etiquettes" class="calque-etiq"></div>
    <div class="nom-type" id="nom-type"></div>
    <div class="outils">
      <button type="button" class="btn-rond" id="b-pause" title="Pause / lecture" aria-label="Pause">⏸</button>
      <button type="button" class="btn-rond" id="b-rejouer" title="Recommencer l'opération" aria-label="Recommencer">⏮</button>
      <button type="button" class="btn-rond" id="b-hud" title="Afficher les paramètres sur la 3D" aria-label="Paramètres sur la 3D" aria-pressed="false">📊</button>
      <button type="button" class="btn-rond" id="b-etiq" title="Étiquettes" aria-label="Étiquettes" aria-pressed="true">🏷️</button>
      <button type="button" class="btn-rond" id="b-centre" title="Recentrer la vue" aria-label="Recentrer">🎯</button>
      <button type="button" class="btn-rond" id="b-plein" title="Plein écran" aria-label="Plein écran">⛶</button>
    </div>
    <div class="hud" id="hud"></div>
    <div class="phase" id="phase"><div class="barre"><i id="progres"></i></div><span id="phase-txt"></span></div>
    <label class="vitesse">🐢 <input type="range" id="vitesse" min="0.2" max="4" step="0.1" value="1" aria-label="Vitesse de l'animation"> 🐇</label>
    <div class="commandes" id="commandes" aria-label="Commandes en plein écran">
      <button type="button" class="btn-cmd" id="c-prec" title="Opération précédente" aria-label="Opération précédente">◀</button>
      <select id="c-op" aria-label="Opération"></select>
      <button type="button" class="btn-cmd" id="c-suiv" title="Opération suivante" aria-label="Opération suivante">▶</button>
      <button type="button" class="btn-cmd" id="c-sens" title="Sens d'avance">➡️</button>
      <button type="button" class="btn-cmd" id="c-arr" title="Arrosage" aria-label="Arrosage">💧</button>
      <button type="button" class="btn-cmd" id="c-mat" title="Matériau de l'outil">Carbure</button>
    </div>
    <div class="info3d" id="info3d" hidden></div>
    <div class="aide3d">1 doigt : tourner · 2 doigts : zoomer / déplacer · toucher une pièce : son nom</div>
  </section>

  <aside class="panneau">
    <div class="infos" id="infos" aria-live="polite"></div>
    <div class="onglets" role="tablist">
      <button type="button" role="tab" data-onglet="reglages" class="actif" aria-selected="true">🎛️ Réglages</button>
      <button type="button" role="tab" data-onglet="fiche">📋 Fiche</button>
      <button type="button" role="tab" data-onglet="cours">📘 Cours</button>
      <button type="button" role="tab" data-onglet="astuces">💡 Astuces</button>
      <button type="button" role="tab" data-onglet="quiz">❓ Quiz</button>
    </div>
    <div class="contenu">
      <div class="page actif" id="p-reglages">
        <div id="params"></div>
        <div id="alertes"></div>
        <h3>Conditions de coupe calculées</h3>
        <div id="resume" class="resume"></div>
        <div id="calculs"></div>
        <button type="button" class="btn" id="b-defaut">↺ Valeurs conseillées</button>
      </div>
      <div class="page" id="p-fiche"></div>
      <div class="page" id="p-cours"></div>
      <div class="page" id="p-astuces"></div>
      <div class="page" id="p-quiz"></div>
    </div>
  </aside>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
